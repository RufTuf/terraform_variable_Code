trigger:
- main

pool: default

stages:
  - stage: terraforminittoplan
    displayName: terraform installation
    jobs: 
    - job: terraforminstall
      steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: 'latest'
    - job: terrafrominit
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          backendServiceArm: 'hclsc'
          backendAzureRmStorageAccountName: 'ztestg'
          backendAzureRmContainerName: 'ztecon'
          backendAzureRmKey: 'terraform.tfstate'
    - job: terraformvalidate
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'validate'
    - job: terraformplan
      steps:
      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'plan'
          environmentServiceNameAzureRM: 'hclsc'
  - stage: 
    displayName: manual validation
    jobs:
      - job: manualvalidation
        pool: server
        steps:
        - task: ManualValidation@1
          inputs:
            notifyUsers: 'nsn.kpil@gmail.com'
            approvers: 'nsn.kapil@gmail.com'
            instructions: 'pls approve'
            onTimeout: 'resume'
  - stage: 
    displayName: sccaning
    jobs:
      - job: 
        pool: default
        steps:
        - task: tfsec@1
          inputs:
            version: 'v1.26.0'
            dir: '$(System.DefaultWorkingDirectory)'
  - stage: 
    displayName: terraformapply
    jobs:
      - job: terraforminit
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            backendServiceArm: 'hclsc'
            backendAzureRmStorageAccountName: 'ztestg'
            backendAzureRmContainerName: 'ztecon'
            backendAzureRmKey: 'terraform.tfstate'

      - job: terraformapply
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'apply'
            commandOptions: '-auto-approve'
            environmentServiceNameAzureRM: 'hclsc'

